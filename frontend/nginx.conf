# nginx serve o frontend já compilado e repassa /api para o backend
server {
    listen 8080;
    root /usr/share/nginx/html;

    # /api/... vai para a API sem mudar o caminho ("api" é o nome do serviço no compose)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Qualquer outra rota volta para o index.html (o React Router cuida dela)
    location / {
        try_files $uri /index.html;
    }
}
