[project]
name = "gestao-vista-api"
version = "0.1.0"
description = "API do Gestao a Vista Microsoft (Intune + Entra ID)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.7.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
